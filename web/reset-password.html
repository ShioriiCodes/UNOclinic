<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNOclinic - Reset Password</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #dedede;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      p {
        margin: 0 0 10px;
      }
      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #bdbdbd;
        border-radius: 8px;
        padding: 10px 12px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 600;
        background: #00696b;
        color: #ffffff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #countdown {
        color: #555555;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Reset Password</h1>
      <p id="status">Preparing password reset...</p>
      <p id="countdown"></p>
      <form id="reset-form">
        <label for="new-password">New Password</label>
        <input id="new-password" type="password" autocomplete="new-password" disabled />

        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" disabled />

        <button id="update-btn" type="submit" disabled>Update Password</button>
      </form>
    </main>
    <script type="module" src="./reset-password.js"></script>
  </body>
</html>
